services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: sih_dev_only
      POSTGRES_DB: sih_dev
    ports:
      - "5432:5432"
    volumes:
      - sih_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih -d sih_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sih_postgres_data:
