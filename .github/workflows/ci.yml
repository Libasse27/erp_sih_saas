name: CI

# CI — Phase 0, etape 13/13 (lacune C de l'audit de securite, docs/architecture/
# 02-roadmap-migration.md §"Criteres de sortie communs", item 10 "Coverage CI"). Perimetre :
# typecheck + lint + build + tests + gate de couverture (seuils geles dans
# apps/api/vitest.config.ts : >=90% domain/+application/ par module, >=70% plancher global).
# SCA (npm audit), scan de secrets, SAST et deploiement restent HORS perimetre de ce fichier
# (residus CI-01/CI-02/DETTE-* suivis separement) — ne pas dupliquer ce perimetre ici.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un seul run actif a la fois par ref : annule un run obsolete si de nouveaux commits arrivent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jamais le defaut du depot/organisation (parfois read & write all scopes) : ce workflow ne push,
# ne commente ni ne publie rien — lecture seule suffit (revue de securite independante, etape 13).
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # PostgreSQL/Redis reels (pas de mocks pour la persistance — regle du mandat) : memes images
    # que docker-compose.yml a la racine du depot, memes identifiants de developpement (jamais
    # utilises en production, voir apps/api/.env.example).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sih
          POSTGRES_PASSWORD: sih_dev_only
          POSTGRES_DB: sih_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sih -d sih_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # Role applicatif non-superuser/non-BYPASSRLS (cree par la migration
      # 20260823173817_identity_rbac_app_role) — jamais le role superuser "sih" a l'execution,
      # sans quoi le RLS PostgreSQL serait silencieusement inoperant (voir apps/api/.env.example).
      DATABASE_URL: "postgresql://sih_app:sih_app_dev_only@localhost:5432/sih_dev?schema=public"
      REDIS_URL: "redis://localhost:6379"
      # Valeurs D'EXEMPLE DE DEVELOPPEMENT UNIQUEMENT (identiques a apps/api/.env.example) —
      # `NODE_ENV=test` neutralise la denylist de config/env.ts qui les refuserait en
      # production/staging. Aucun secret reel dans ce depot (regle §7.1 du mandat).
      PAYMENT_PROVIDER_WEBHOOK_SECRET: "ci_only_sandbox_webhook_secret_not_for_prod_32c"
      MFA_SECRET_ENCRYPTION_KEY: "ZGV2X29ubHlfbmV2ZXJfdXNlX3Byb2RfMzJieXRlcyE="
      MFA_SECRET_ENCRYPTION_KEY_ID: "k1"
      MFA_RECOVERY_CODE_PEPPER: "dev_only_never_use_in_prod_recovery_code_pepper_32c"
      MFA_RECOVERY_CODE_PEPPER_ID: "p1"
      MFA_TOTP_ISSUER: "SIH"
      REFRESH_TOKEN_HASH_PEPPER: "dev_only_never_use_in_prod_refresh_token_pepper_32c"
      REFRESH_TOKEN_HASH_PEPPER_ID: "p1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Aucun postinstall/prepare ne genere le client Prisma dans ce depot (verifie :
      # apps/api/package.json et le package.json racine n'en declarent aucun) -- sans cette etape,
      # `Prisma.<Model>WhereInput`/`Prisma.InputJsonValue` et les types de modele sont absents sur
      # un checkout propre, ce qui fait echouer le typecheck (et potentiellement le build) sur des
      # modules sans rapport avec le changement en cours.
      - name: Generate Prisma Client
        working-directory: apps/api
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Apply database migrations (role superuser, DDL uniquement)
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://sih:sih_dev_only@localhost:5432/sih_dev?schema=public"
        run: pnpm exec prisma migrate deploy

      - name: Test (unitaire + integration, PostgreSQL/Redis reels)
        run: pnpm test

      # Reexecute la suite apps/api avec instrumentation v8 (`--coverage`) pour appliquer les
      # seuils geles de vitest.config.ts (etape 13, item 10) — jamais fusionne avec l'etape
      # "Test" ci-dessus : `test:coverage` force `--fileParallelism=false` (voir commentaire dans
      # vitest.config.ts) car l'instrumentation ralentit assez l'execution pour rendre flaky des
      # tests d'integration Redis dependants d'une fenetre temporelle reelle quand les fichiers
      # tournent en parallele — un cout CI d'environ 6 minutes supplementaires, accepte pour ne
      # jamais fusionner un gate de couverture avec une suite instable.
      - name: Coverage gate (apps/api, seuils vitest.config.ts — etape 13, item 10)
        working-directory: apps/api
        run: pnpm run test:coverage
